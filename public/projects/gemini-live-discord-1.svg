        <rect x="30" y="60" width="16" height="35" rx="3" fill="url(#cyanGlow)" /><rect x="57" y="52.34400694069365" width="16" height="42.65599305930635" rx="3" fill="url(#cyanGlow)" /><rect x="84" y="57.12760005689982" width="16" height="37.87239994310018" rx="3" fill="url(#cyanGlow)" /><rect x="111" y="63.931125316408156" width="16" height="31.068874683591844" rx="3" fill="url(#cyanGlow)" /><rect x="138" y="63.85050124594611" width="16" height="31.149498754053887" rx="3" fill="url(#cyanGlow)" /><rect x="165" y="56.98335409753835" width="16" height="38.01664590246165" rx="3" fill="url(#cyanGlow)" /><rect x="192" y="52.347846672963264" width="16" height="42.652153327036736" rx="3" fill="url(#cyanGlow)" /><rect x="219" y="60.2970809301819" width="16" height="34.7029190698181" rx="3" fill="url(#cyanGlow)" /><rect x="246" y="83.32118922467475" width="16" height="11.678810775325253" rx="3" fill="url(#cyanGlow)" /><rect x="273" y="112.46926697963265" width="16" height="-17.46926697963265" rx="3" fill="url(#cyanGlow)" /><rect x="300" y="132.43615935597194" width="16" height="-37.43615935597194" rx="3" fill="url(#cyanGlow)" /><rect x="327" y="131.80043048157094" width="16" height="-36.80043048157094" rx="3" fill="url(#cyanGlow)" /><rect x="354" y="110.93335519356624" width="16" height="-15.933355193566245" rx="3" fill="url(#cyanGlow)" /><rect x="381" y="81.7398138513175" width="16" height="13.260186148682486" rx="3" fill="url(#cyanGlow)" /><rect x="408" y="59.422821773027664" width="16" height="35.577178226972336" rx="3" fill="url(#cyanGlow)" /><rect x="435" y="52.35004415148054" width="16" height="42.64995584851946" rx="3" fill="url(#cyanGlow)" /><rect x="462" y="57.41797188955475" width="16" height="37.58202811044525" rx="3" fill="url(#cyanGlow)" /><rect x="489" y="64.08424321426887" width="16" height="30.915756785731137" rx="3" fill="url(#cyanGlow)" /><rect x="516" y="63.68130642766668" width="16" height="31.318693572333324" rx="3" fill="url(#cyanGlow)" /><rect x="543"