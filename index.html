<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riddhiman Kundal | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/monitor.css" />
  </head>
  <body>
    <!-- Portrait Orientation Alert Message -->
    <aside id="portrait-alert" class="portrait-alert-banner hidden" role="alert">
      <div class="alert-icon-wrap">
        <svg class="rotate-device-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
          <path d="M12 18h.01" />
          <path d="M19 12c1.66 0 3-1.34 3-3V6" />
          <path d="M22 6l-2 2-2-2" />
        </svg>
      </div>
      <div class="alert-content">
        <div class="alert-heading">LANDSCAPE MODE RECOMMENDED</div>
        <p class="alert-body">
          This portfolio is designed for landscape viewing. Please rotate your device for the full workstation experience.
        </p>
      </div>
      <button id="dismiss-portrait-alert" class="alert-dismiss-btn" aria-label="Dismiss notice">DISMISS</button>
    </aside>

    <!-- 3D Three.js & CSS3D Mount Points -->
    <div id="css3d-container"></div>
    <div id="webgl-container"></div>

    <script type="module" src="/src/monitor.js"></script>
  </body>
</html>
